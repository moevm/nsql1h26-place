name: shrooms
services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    expose:
      - 27017
    volumes:
      - mongodb_data:/data/db
      - ./backend/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh
    restart:
      always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    container_name: backend
    expose:
      - 8080
    restart: always
    env_file: ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 0.0.0.0 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    container_name: frontend
    expose:
      - 5173
    restart: always
    env_file: ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
  nginx:
    container_name: nginx
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:80:80"
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data: