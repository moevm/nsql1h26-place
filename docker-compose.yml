name: shrooms

services:
  db:
    build:
      context: ./backend
      dockerfile: Dockerfile.db
    container_name: db
    expose:
      - 27017
    volumes:
      - db_data:/data/db
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    expose:
      - 8080
    restart: always
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 0.0.0.0 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "127.0.0.1:5173:5173"
    expose:
      - 5173
    restart: always
    env_file: ./frontend/.env
    volumes:
      - ./frontend:/app:ro
    depends_on:
      backend:
        condition: service_healthy

  nginx:
  container_name: nginx
  image: nginx:1.27.5-alpine
  ports:
    - "127.0.0.1:8080:80"
  restart: always
  volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
  depends_on:
    - frontend
    - backend

volumes:
  db_data: